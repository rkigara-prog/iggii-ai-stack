# iggii-ai-stack — LiteLLM routing proxy
#
# Deployed to the Unraid server alongside the existing n8n / OMC stack.
# Secrets are read from an env file OUTSIDE this repo checkout so they
# survive `git pull` / Actions checkouts (which wipe untracked files).
# Create /mnt/user/appdata/iggii-ai-stack/secrets.env by hand from
# .env.example before first `docker compose up`.
#
# Plain bridge networking (no custom `networks:` block -> Compose makes
# its own project-scoped bridge, "iggii-ai-stack_default"), matching how
# every other service on this box actually runs. Earlier draft put this
# on the `br0` macvlan network, which turned out to be the wrong call:
# macvlan containers get their own LAN IP and the HOST itself can't
# reach them via localhost -- a real Docker limitation, not a config
# typo. Bridge + published port avoids that entirely.

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: iggii-litellm
    restart: unless-stopped
    env_file:
      - /mnt/user/appdata/iggii-ai-stack/secrets.env
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
