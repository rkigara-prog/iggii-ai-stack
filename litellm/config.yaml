# LiteLLM proxy config — unifies OpenAI, Anthropic, and local Ollama behind
# one OpenAI-compatible API for n8n (and anything else) to call.
#
# Model slugs drift over time — check platform.openai.com/docs/models and
# console.anthropic.com before relying on the exact names below.

model_list:
  # --- OpenAI ---------------------------------------------------------
  - model_name: gpt-5
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY

  # --- Anthropic --------------------------------------------------------
  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- Local Ollama -------------------------------------------------------
  # NOTE: this is for NEW chat/research routing only. OMC's existing
  # Ollama calls (native /api/chat, `think`/`format`/`num_ctx` fields) are
  # OUT OF SCOPE here and must keep calling Ollama directly, not through
  # this proxy, until that's tested separately on a throwaway copy.
  - model_name: local-qwen
    litellm_params:
      model: ollama/qwen3.5:9b
      api_base: os.environ/OLLAMA_BASE_URL

  - model_name: local-gptoss
    litellm_params:
      model: ollama/gpt-oss:20b
      api_base: os.environ/OLLAMA_BASE_URL

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 120

router_settings:
  # If a paid/cloud model errors or times out, fall back to a local model
  # rather than failing the request outright.
  fallbacks:
    - claude-sonnet: ["local-qwen"]
    - gpt-5-mini: ["local-qwen"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
