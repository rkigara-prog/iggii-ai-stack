name: localai-images

services:
  comfyui:
    image: intel/llm-scaler-omni@sha256:b692be544940c3896bdf11fb3d66bbc089f1214a9e4f6749c34de43db8fddf23
    container_name: localai-comfyui
    restart: unless-stopped
    stop_grace_period: 60s
    devices:
      - /dev/dri:/dev/dri
    shm_size: 8g
    ports:
      - "192.168.113.32:8188:8188"
    environment:
      ZE_AFFINITY_MASK: "1"
    working_dir: /llm/ComfyUI
    volumes:
      - /srv/localai/comfyui/models:/models:ro
      - /srv/localai/comfyui/model-paths.yaml:/config/model-paths.yaml:ro
      - /srv/localai/comfyui/input:/data/input
      - /srv/localai/comfyui/output:/data/output
      - /srv/localai/comfyui/user:/data/user
    command:
      - python
      - main.py
      - --listen
      - 0.0.0.0
      - --port
      - "8188"
      - --extra-model-paths-config
      - /config/model-paths.yaml
      - --input-directory
      - /data/input
      - --output-directory
      - /data/output
      - --user-directory
      - /data/user
      - --disable-dynamic-vram
      - --reserve-vram
      - "2"
      - --disable-smart-memory
      - --cache-none
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
